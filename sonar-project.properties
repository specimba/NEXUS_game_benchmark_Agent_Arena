# SonarCloud analysis scope — CI/scanner-based analyses (benchmark-ci once installed).
# Automatic analysis (autoscan) ignores this file; it reads .sonarcloud.properties
# from the default branch instead (same exclusion is configured there).
#
# archive/ holds deliberately preserved historical artifacts (the TIDEWRIGHT
# legacy build and its era documents). They are evidence of where the benchmark
# came from, not active code: they are kept byte-faithful and excluded from
# static-analysis gates instead of being "fixed" in place.
sonar.exclusions=archive/**
