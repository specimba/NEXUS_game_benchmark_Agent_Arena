# SonarQube Cloud AUTOMATIC ANALYSIS (autoscan) configuration.
#
# Autoscan reads this file from the DEFAULT branch only, and does not accept
# wildcard patterns here — hence the bare directory name. It takes effect for
# every analysis once this file is on master (it arrives with this PR's merge).
# CI-based scanner analyses use sonar-project.properties instead.
#
# archive/ holds deliberately preserved historical artifacts (the TIDEWRIGHT
# legacy build); they are kept byte-faithful and excluded from analysis.
sonar.exclusions=archive
